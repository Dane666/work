# V8.1 每日策略自动运行（GitHub Actions）
#
# 【关键修复 2026-08-20】数据外置说明：
#   GitHub Actions 美国 runner 无法稳定访问 akshare 中国数据源
#   （stock_info_a_code_name 等调用 ConnectionReset），原先「首次全量抓取」
#   步骤必然失败并掩盖后续步骤（FileNotFoundError 级联崩溃）。
#   现改为从独立 data 分支拉取预构建的核心面板（基准 2025-08-12）：
#     v8_close_panel / v8_amount_panel / v6_index / roe_panel_v8 /
#     gpm_yoy_panel_v8 / v3_ohlcv.pkl / v6_amount_panel / v8_universe.json /
#     v8_ohlcv.pkl（V8.1 dashboard 蜡烛图 K 线）/ _v8_revsignal_cache.parquet
#
#   数据更新流程（本地）：更新面板后
#     git add -f data/<文件> && git commit -m "update data" && git push origin data
#   下次 Actions 运行即使用新数据。cron 为 UTC 时间，'0 16 * * 1-5' = 北京次日 00:00。
name: Daily Strategy Run

on:
  schedule:
    - cron: '0 16 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    # V8.1 dashboard：contents 写入 docs、pages/id-token 用于 GitHub Pages 部署
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: strategy-deploy
      cancel-in-progress: false
    env:
      TZ: 'Asia/Shanghai'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 数据外置：从 data 分支拉取预构建面板（绕过 Actions 无法访问中国源的问题）
      - name: Checkout prebuilt data (data branch)
        uses: actions/checkout@v4
        with:
          repository: Dane666/work
          ref: data
          path: _data_bundle
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage data into workspace
        run: |
          mkdir -p data
          cp -r _data_bundle/data/. data/
          echo "=== 已载入数据文件 ==="
          ls -la data/

      # 数据完整性校验：缺失时给出明确指引，避免 FileNotFoundError 级联崩溃
      - name: Verify data presence
        run: |
          missing=0
          for f in v8_close_panel.parquet v8_amount_panel.parquet v6_index.parquet \
                   roe_panel_v8.parquet gpm_yoy_panel_v8.parquet v3_ohlcv.pkl \
                   v6_amount_panel.parquet v8_universe.json \
                   v8_ohlcv.pkl \
                   mainboard_close_panel.parquet mainboard_amount_panel.parquet \
                   roe_panel_mainboard.parquet gpm_yoy_panel_mainboard.parquet \
                   div_yield_panel_mainboard.parquet mainboard_universe.json; do
            if [ ! -f "data/$f" ]; then
              echo "::error::缺失数据文件 data/$f —— 请本地更新面板后执行 git push origin data"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "数据完整性校验通过"

      - name: Run signal generator (V8.1 / 主板版V3)
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          cd src
          # GitHub Actions 无法访问 akshare 中国源，故不加 --live
          # （--live 会逐只股票请求实时行情并因超时卡死数小时）；
          # 实时刷新请在本机/云服务器执行。Actions 直接用 data 分支面板生成信号。
          # config.USE_MAINBOARD=True → 主板版 V3 链路（收窄池+质量过滤+长动量+股息率门控）。
          python signal_generator.py

      # ---- 状态恢复：从 data 分支载入上一日 sim 状态（持仓/现金/净值历史）与历史信号 ----
      # data/ 已由「Stage data into workspace」从 data 分支载入；此处显式恢复 data/state/
      # 与 data/signals/ 作为兜底，确保 Actions 全新 checkout 也能基于上一日状态继续
      # （跨运行连续；历史信号用于 signal_generator 计算 HOLD/BUY/SELL 增量）。
      - name: Restore sim state from data branch
        run: |
          mkdir -p data/state output/signals
          git fetch origin data 2>/dev/null || true
          git checkout origin/data -- data/state/ 2>/dev/null || echo "No existing sim state found, starting fresh"
          git checkout origin/data -- data/signals/ 2>/dev/null || echo "No existing signals found, starting fresh"
          # signal_generator 读取 output/signals/，将持久化历史信号同步过去
          [ -d data/signals ] && cp -r data/signals/. output/signals/ 2>/dev/null || true
          echo "=== 恢复后的 data/state ==="
          ls -la data/state/ 2>/dev/null || echo "(data/state 为空)"
          echo "=== 恢复后的 output/signals ==="
          ls -la output/signals/ 2>/dev/null || echo "(output/signals 为空)"

      - name: Run sim tracker
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          cd src
          # --offline：Actions 美国 runner 无法访问中国行情源，跳过实时行情拉取
          # （fetch_day_prices 已加 socket 超时作为兜底），直接记录挂起状态并持久化。
          python sim_tracker.py --offline

      # ---- 状态保存：将更新后的 sim 状态与历史信号推送回 data 分支（跨运行持久化）----
      # 用独立克隆推送到 data 分支，避免污染 main（data/ 在 main 被 .gitignore 忽略）。
      - name: Persist sim state to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if { [ ! -d data/state ] || [ -z "$(ls -A data/state 2>/dev/null)" ]; } \
             && { [ ! -d output/signals ] || [ -z "$(ls -A output/signals 2>/dev/null)" ]; }; then
            echo "无 sim state / 信号需持久化，跳过"
            exit 0
          fi
          rm -rf /tmp/sim_state_push && mkdir -p /tmp/sim_state_push/state /tmp/sim_state_push/signals
          [ -d data/state ] && cp -r data/state/. /tmp/sim_state_push/state/ 2>/dev/null || true
          [ -d output/signals ] && cp -r output/signals/. /tmp/sim_state_push/signals/ 2>/dev/null || true
          rm -rf /tmp/data_repo
          git clone --filter=blob:none --no-checkout --branch data --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/data_repo
          cd /tmp/data_repo
          git sparse-checkout set data/state data/signals
          git checkout data -- data/state data/signals 2>/dev/null || mkdir -p data/state data/signals
          cp -r /tmp/sim_state_push/state/. data/state/ 2>/dev/null || true
          cp -r /tmp/sim_state_push/signals/. data/signals/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/state data/signals 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sim state / 信号 无变化，跳过提交"
          else
            git commit -m "chore(state): update sim state & signals $(date '+%Y-%m-%d')"
            git push
            echo "sim state / 信号 已推送到 data 分支"
          fi

      # V8.1 dashboard：持仓走势图 + GitHub Pages 部署
      # Actions 上跑默认 offline（仅用 data 分支面板，无中国源拉取不了 akshare），
      # 本地/云服务器用 `python generate_dashboard.py --live` 可叠加最新行情。
      - name: Install CJK fonts (for matplotlib 中文渲染)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra >/dev/null 2>&1 \
            || echo "::warning::CJK font install failed，图表中文可能显示为方块"

      - name: Generate dashboard (charts + HTML)
        run: |
          cd src
          python generate_dashboard.py

      - name: Commit & push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs 无变化，跳过提交"
          else
            git commit -m "chore(docs): update V8.1 strategy dashboard [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (signals & nav)
        uses: actions/upload-artifact@v4
        with:
          name: strategy-outputs
          path: |
            output/signals/
            output/sim_nav/

      # 每日结果 Bark 推送至手机（参考 Momentum/notify/bark.py）。
      # 通过 env 注入 BARK_DEVICE_KEY secret；脚本内部在未配置 key 时自动跳过推送（仅预览）。
      - name: Bark push (每日结果)
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          cd src
          python notify_push_daily.py
